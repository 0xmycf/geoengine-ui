<div
    #hoverMapContainer
    id="hover-map-container"
    [style.width.px]="hoverMapWidthPx"
    [style.height.px]="hoverMapHeightPx"
>
    <button
        id="hover-map-resize-handle"
        type="button"
        aria-label="Resize hover map"
        (pointerdown)="onResizeStart($event)"
    ></button>

    <button (click)="onReloadButton()" id="reload-map-button">
        <mat-icon>refresh</mat-icon>
        <span class="mat-body-2">Reload</span>
    </button>

    <geoengine-map-container #map [grid]="mapIsGrid$ | async | valueDefault: false">
        @if (userService.getSessionTokenStream() | async; as sessionToken) {
            @for (layer of layersReverse$ | async; track layer.id) {
                @if (layer.layerType === 'vector') {
                    <geoengine-ol-vector-layer
                        [layerId]="layer.id"
                        [workflow]="layer.workflowId"
                        [symbology]="$any(layer.symbology)"
                        [isVisible]="layer.isVisible"
                        (mapRedraw)="map.layerForcesRedraw()"
                    ></geoengine-ol-vector-layer>
                }
                @if (layer.layerType === 'raster') {
                    <geoengine-ol-raster-layer
                        [layerId]="layer.id"
                        [workflow]="layer.workflowId"
                        [symbology]="$any(layer.symbology)"
                        [isVisible]="layer.isVisible"
                        [sessionToken]="sessionToken"
                        (mapRedraw)="map.layerForcesRedraw()"
                    ></geoengine-ol-raster-layer>
                }
            }
        }
    </geoengine-map-container>
</div>
